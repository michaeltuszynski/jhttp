# Image comes from the service's artifact source (tag = this run's CI build number), so every
# deploy changes the pod spec and rolls out exactly the image CI just built and tested.
# (Was hard-coded :latest — run #6 showed that makes a green deploy a no-op.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhttp
  labels:
    app: jhttp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jhttp
  template:
    metadata:
      labels:
        app: jhttp
    spec:
      containers:
        - name: jhttp
          image: <+artifacts.primary.image>
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
