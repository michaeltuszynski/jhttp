# Image comes from values.yaml (Harness artifact expression), so every deploy changes the pod
# spec and rolls out exactly the image CI just built. Hard-coded :latest made run #6 a no-op.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhttp
  labels:
    app: jhttp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jhttp
  template:
    metadata:
      labels:
        app: jhttp
    spec:
      containers:
        - name: jhttp
          image: {{.Values.image}}
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
